    <head>
        <meta name="robots" content="noindex, nofollow">
        <script>
            // set initial theme before paint
            (function() {
                const stored = localStorage.getItem('theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = stored || (prefersDark ? 'dark' : 'light');
                if (theme === 'dark') document.documentElement.classList.add('dark');
            })();
        </script>

        <div class="top-toggle">
            <label class="switch" aria-label="Toggle theme">
                <input id="theme-toggle" class="switch__input" type="checkbox" role="switch" aria-label="Toggle theme">
                <span class="switch__icon">
                    <span class="switch__icon-part switch__icon-part--1"></span>
                    <span class="switch__icon-part switch__icon-part--2"></span>

        <div class="container">
            <h1>Resume</h1>
                    <iframe src="resume-new-sd.pdf" title="Resume PDF"></iframe>
        </div>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const btn = document.getElementById('theme-toggle');
                if (!btn) return;
                const setTheme = (mode) => {
                    document.documentElement.classList.toggle('dark', mode === 'dark');
                    localStorage.setItem('theme', mode);
                    btn.checked = mode === 'dark';
                };
                const stored = localStorage.getItem('theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const current = stored || (prefersDark ? 'dark' : 'light');
                setTheme(current);
                btn.addEventListener('click', () => {
                    const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
                    setTheme(next);
                });
            });
        </script>
